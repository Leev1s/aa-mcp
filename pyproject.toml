[project]
name = "aa-mcp"
version = "0.1.3"
description = "MCP server wrapping the Artificial Analysis API for LLM and multimodal model data queries"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Jasen" },
]
keywords = ["mcp", "artificial-analysis", "llm", "ai", "benchmark", "model-comparison"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "build>=1.2.2",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "twine>=6.0.0",
]

[project.scripts]
aa-mcp = "aa_mcp.server:main"

[project.urls]
Homepage = "https://github.com/Leev1s/aa-mcp"
Repository = "https://github.com/Leev1s/aa-mcp"
Issues = "https://github.com/Leev1s/aa-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aa_mcp"]

[tool.ruff]
line-length = 88
target-version = "py310"
